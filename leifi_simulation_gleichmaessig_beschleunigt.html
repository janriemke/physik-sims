function animate(tm_alt) {
	if(run) {
		var tm_neu = (new Date()).getTime();
		var dt = (tm_neu - tm_alt) / 1000;
		t = t + dt;

		if (t < t0) {
			zeichne_hintergrund ();
			zeichneUhr (ctx, Uhr, t0);
			Kugel.x = holeAchseHorizontalx (Achse, xvor_(t));
			ctx.globalAlpha = 0.5*(t-tvor);
			zeichneKugel(ctx,Kugel);
			ctx.globalAlpha = 1;
			Kugel.x = holeAchseHorizontalx (Achse, x_(t0));
			zeichneKugel(ctx,Kugel);
			zeichneKoordinatensystemKreuz(ctx,Koordinatensystem1,t0,x_(t0),4,"#FF0000",2,"round");
			zeichneKoordinatensystemKreuz(ctx,Koordinatensystem2,t0,v_(t0),4,"#C3C800",2,"round");
			zeichneKoordinatensystemKreuz(ctx,Koordinatensystem3,t0,a_(t0),4,"#5A145A",2,"round");
			}
		else if (t < tende) {
			zeichne_hintergrund ();
			zeichneUhr (ctx, Uhr, t);
			Kugel.x = holeAchseHorizontalx (Achse, x_(t));
			zeichneKugel(ctx,Kugel);
			zeichneKoordinatensystemKreuz(ctx,Koordinatensystem1,t0,x_(t0),4,"#FF0000",2,"round");
			zeichneKoordinatensystemKreuz(ctx,Koordinatensystem2,t0,v_(t0),4,"#C3C800",2,"round");
			zeichneKoordinatensystemKreuz(ctx,Koordinatensystem3,t0,a_(t0),4,"#5A145A",2,"round");
			if (Number(a.value) == 0)
				zeichneKoordinatensystemGerade(ctx,Koordinatensystem1,t0,x_(t0),t,x_(t),"#FF0000",2,"round");
			else
				zeichneKoordinatensystemParabel(ctx,Koordinatensystem1,t0,x_(t0),v_(t0),t,x_(t),v_(t),"#FF0000",2,"round");
			zeichneKoordinatensystemGerade(ctx,Koordinatensystem2,t0,v_(t0),t,v_(t),"#C3C800",2,"round");
			zeichneKoordinatensystemGerade(ctx,Koordinatensystem3,t0,a_(t0),t,a_(t),"#5A145A",2,"round");
			}
		else if (t < tnach) {
			zeichne_hintergrund ();
			zeichneUhr (ctx, Uhr, t0);
			Kugel.x = holeAchseHorizontalx (Achse, x_(t));
			ctx.globalAlpha = 1-0.5*(t-tende);
			zeichneKugel(ctx,Kugel);
			ctx.globalAlpha = 1;
			Kugel.x = holeAchseHorizontalx (Achse, x_(tende));
			zeichneKugel(ctx,Kugel);
			zeichneKoordinatensystemKreuz(ctx,Koordinatensystem1,t0,x_(t0),4,"#FF0000",2,"round");
			zeichneKoordinatensystemKreuz(ctx,Koordinatensystem2,t0,v_(t0),4,"#C3C800",2,"round");
			zeichneKoordinatensystemKreuz(ctx,Koordinatensystem3,t0,a_(t0),4,"#5A145A",2,"round");
			if (Number(a.value) == 0)
				zeichneKoordinatensystemGerade(ctx,Koordinatensystem1,t0,x_(t0),tende,x_(tende),"#FF0000",2,"round");
			else
				zeichneKoordinatensystemParabel(ctx,Koordinatensystem1,t0,x_(t0),v_(t0),tende,x_(tende),v_(tende),"#FF0000",2,"round");
			zeichneKoordinatensystemGerade(ctx,Koordinatensystem2,t0,v_(t0),tende,v_(tende),"#C3C800",2,"round");
			zeichneKoordinatensystemGerade(ctx,Koordinatensystem3,t0,a_(t0),tende,a_(tende),"#5A145A",2,"round");
			}
   		else {
			startknopf.style.display = "none";
			run = false;
			resetknopf.style.display = "inline";
			end = true;
    			}
    		requestAnimFrame(function() {animate(tm_neu);});
		}

function x_(t) {return Number(x0.value) + Number(v0.value) * t + 0.5 * Number(a.value) * t*t}
function xvor_(t) {return Number(x0.value) + Number(v0.value) * t}
function v_(t) {return Number(v0.value) + Number(a.value) * t}
function a_(t) {return Number(a.value)}

function zeichne_hintergrund () {
	ctx.clearRect(0, 0, canvas.width, canvas.height);
	zeichneAchseHorizontal(ctx,Achse);
	ctx.clearRect(Uhr.x-Uhr.r-5, Uhr.y-Uhr.r-5, 2*Uhr.r+10, 2*Uhr.r+10);
	zeichneKoordinatensystem (ctx,Koordinatensystem1);
	zeichneKoordinatensystem (ctx,Koordinatensystem2);
	zeichneKoordinatensystem(ctx,Koordinatensystem3);
	}

function zeichneKugel (ctx,K) {
	ctx.beginPath();
	ctx.arc(K.x, K.y, K.r, 0, 2.0*Math.PI);
	var grd = ctx.createRadialGradient(K.x-K.r/3, K.y-K.r/3, 0, K.x, K.y, K.r);
	grd.addColorStop(0, "#FFFFFF");
	grd.addColorStop(1, K.farbe);
	ctx.fillStyle = grd;
	ctx.fill();
	if (K.randbreite > 0){
		ctx.lineWidth = K.randbreite;
		ctx.strokeStyle = K.randfarbe;
		ctx.stroke();
		}
	}

function zeichneUhr (ctx,U,t) {
	ctx.save();
	ctx.translate(U.x, U.y);
	ctx.beginPath();
	ctx.arc(0, 0, U.r, 0, 2 * Math.PI, true);
	ctx.fillStyle = U.farbe;
	ctx.strokeStyle = U.randfarbe;
	ctx.lineWidth = U.randbreite;
	ctx.stroke();
	ctx.beginPath();
	for (var i=0; i<U.strichanzahl; i++) {
  		ctx.rotate(2 * Math.PI/U.strichanzahl);
  		ctx.moveTo(0, - U.r);
  		ctx.lineTo(0, - U.r + U.strichlaenge);
		}
  	ctx.lineWidth = U.strichbreite;
  	ctx.strokeStyle = U.strichfarbe;
  	ctx.stroke();
	ctx.beginPath();
	ctx.arc(0, 0, U.achse, 0, 2 * Math.PI, true);
	ctx.moveTo(0, 0);
	var phi = 2 * Math.PI / U.sekunden * t;
	ctx.lineTo(U.zeigerlaenge * Math.sin(phi), - U.zeigerlaenge * Math.cos(phi));
  	ctx.lineWidth = U.zeigerbreite;
  	ctx.strokeStyle = U.zeigerfarbe;
	ctx.lineCap = U.zeigerenden;
  	ctx.stroke();
  	ctx.restore();
	}

function zeichneKoordinatensystem (ctx,K) {
	var xs = K.x;
	var xe = K.x + K.breite;
	var xf = K.breite/(K.xende-K.xstart);
	var x0 = xs+Math.abs(K.xstart)/(Math.abs(K.xstart)+Math.abs(K.xende))*K.breite;
	var ys = K.y + K.hoehe;
	var ye = K.y;
	var yf = K.hoehe/(K.yende-K.ystart);
	var y0 = ys-Math.abs(K.ystart)/(Math.abs(K.ystart)+Math.abs(K.yende))*K.hoehe;
	var phi = Math.PI/8;
	ctx.beginPath();
    	ctx.rect(K.x, K.y, K.breite, K.hoehe);
    	ctx.fillStyle = K.hintergrundfarbe;
    	ctx.fill();
	ctx.beginPath();
	ctx.strokeStyle = K.achsenfarbe;
	ctx.lineWidth = K.achsenlinienbreite;
	ctx.lineCap = K.achsenlinienenden;
	ctx.moveTo(xs, y0);
	ctx.lineTo(xe, y0);
	ctx.moveTo(xe, y0);
	ctx.lineTo(xe - K.xhoehe*Math.cos(-phi),y0 - K.xhoehe*Math.sin(-phi));
	ctx.moveTo(xe, y0);
	ctx.lineTo(xe - K.xhoehe*Math.cos(phi),y0 - K.xhoehe*Math.sin(phi));
	ctx.moveTo(x0, ys);
	ctx.lineTo(x0, ye);
	ctx.moveTo(x0, ye);
	ctx.lineTo(x0 - K.ybreite*Math.sin(-phi),ye + K.ybreite*Math.cos(-phi));
	ctx.moveTo(x0, ye);
	ctx.lineTo(x0 - K.ybreite*Math.sin(phi), ye + K.ybreite*Math.cos(phi));
	if (K.xstriche) {
		for (var x = K.xstrichestart; x <= K.xstricheende; x += K.xstricheschrittweite) {
			ctx.moveTo(x*xf+x0, y0-K.xhoehe/2);
			ctx.lineTo(x*xf+x0, y0+K.xhoehe/2);
			}
		}
	if (K.ystriche) {
		for (var y = K.ystrichestart; y <= K.ystricheende; y += K.ystricheschrittweite) {
			ctx.moveTo(x0-K.ybreite/2, -y*yf+y0);
			ctx.lineTo(x0+K.ybreite/2, -y*yf+y0);
			}
		}
	ctx.font = K.schriftart;
	ctx.fillStyle = K.schriftfarbe;
	ctx.fillText(K.xtext,xe + K.xtextxversatz,y0 + K.xtextyversatz);
	ctx.fillText(K.ytext,x0 + K.ytextxversatz, ye - K.ytextyversatz);
	if (K.xskala) {
		for (var x = K.xskalastart; x <= K.xskalaende; x += K.xskalaschrittweite) {
			if (Math.abs(x) > K.eps) {
				ctx.fillText(String(x.toFixed(K.xskalastellen)),x*xf+x0 + K.xskalaxversatz,y0+K.xskalayversatz);
				}
			}
		}
	if (K.xursprung) {
		var i = 0.0;
		ctx.fillText(String(i.toFixed(K.xskalastellen)),x0 + K.xskalaxversatz,y0 + K.xskalayversatz);
		}
	if (K.yskala) {
		for (var y = K.yskalastart; y <= K.yskalaende; y += K.yskalaschrittweite) {
			if (Math.abs(y) > K.eps) {
				ctx.fillText(String(y.toFixed(K.yskalastellen)),x0+K.yskalaxversatz,-y*yf+y0 - K.yskalayversatz);
				}
			}
		}
	if (K.yursprung) {
		var i = 0.0;
		ctx.fillText(String(i.toFixed(K.yskalastellen)),x0 + K.yskalaxversatz,y0 - K.yskalayversatz);
		}
	ctx.stroke();

	ctx.beginPath();
	ctx.strokeStyle = K.rasterfarbe;
	ctx.lineWidth = K.rasterlinienbreite;
	ctx.lineCap = K.rasterlinienenden;
	if (K.xraster) {
		for (var x = K.xrasterstart; x <= K.xrasterende; x += K.xrasterschrittweite) {
			ctx.moveTo(x*xf+x0, ys);
			ctx.lineTo(x*xf+x0, ye);
			}
		}
	if (K.yraster) {
		for (var y = K.yrasterstart; y <= K.yrasterende; y += K.yrasterschrittweite) {
			ctx.moveTo(xs, -y*yf+y0);
			ctx.lineTo(xe, -y*yf+y0);
			}
		}
	ctx.stroke();
	}

function zeichneKoordinatensystemKreuz (ctx,K,x,y,laenge,farbe,breite,enden) {
	ctx.save();
	ctx.beginPath();
	ctx.rect(K.x, K.y, K.breite, K.hoehe);
	ctx.clip();
	var xk = K.x + K.breite / (K.xende - K.xstart) * (x - K.xstart);
	var yk = K.y + K.hoehe + K.hoehe / (K.yende - K.ystart) * (K.ystart - y);
	ctx.beginPath();
	ctx.moveTo(xk-laenge, yk-laenge);
	ctx.lineTo(xk+laenge, yk+laenge);
	ctx.moveTo(xk+laenge, yk-laenge);
	ctx.lineTo(xk-laenge, yk+laenge);
	ctx.strokeStyle = farbe;
	ctx.lineWidth = breite;
	ctx.lineCap = enden;
	ctx.stroke();
	ctx.restore();
	}

function zeichneKoordinatensystemGerade (ctx,K,xs,ys,xe,ye,farbe,breite,enden) {
	ctx.save();
	ctx.beginPath();
	ctx.rect(K.x, K.y, K.breite, K.hoehe);
	ctx.clip();
	var xsk = K.x + K.breite / (K.xende - K.xstart) * (xs - K.xstart);
	var ysk = K.y + K.hoehe + K.hoehe / (K.yende - K.ystart) * (K.ystart - ys);
	var xek = K.x + K.breite / (K.xende - K.xstart) * (xe - K.xstart);
	var yek = K.y + K.hoehe + K.hoehe / (K.yende - K.ystart) * (K.ystart - ye);
	ctx.beginPath();
	ctx.moveTo(xsk, ysk);
	ctx.lineTo(xek, yek);
	ctx.strokeStyle = farbe;
	ctx.lineWidth = breite;
	ctx.lineCap = enden;
	ctx.stroke();
	ctx.restore();
	}

function zeichneKoordinatensystemParabel (ctx,K,xs,ys,ms,xe,ye,me,farbe,breite,enden) {
	ctx.save();
	ctx.beginPath();
	ctx.rect(K.x, K.y, K.breite, K.hoehe);
	ctx.clip();
	var xc = (ms*xs-me*xe-ys+ye)/(ms-me);
	var yc = ms*(xc-xs)+ys;
	var xsk = K.x + K.breite / (K.xende - K.xstart) * (xs - K.xstart);
	var ysk = K.y + K.hoehe + K.hoehe / (K.yende - K.ystart) * (K.ystart - ys);
	var xck = K.x + K.breite / (K.xende - K.xstart) * (xc - K.xstart);
	var yck = K.y + K.hoehe + K.hoehe / (K.yende - K.ystart) * (K.ystart - yc);
	var xek = K.x + K.breite / (K.xende - K.xstart) * (xe - K.xstart);
	var yek = K.y + K.hoehe + K.hoehe / (K.yende - K.ystart) * (K.ystart - ye);
	ctx.beginPath();
	ctx.moveTo(xsk, ysk);
	ctx.quadraticCurveTo(xck, yck, xek, yek);
	ctx.strokeStyle = farbe;
	ctx.lineWidth = breite;
	ctx.lineCap = enden;
	ctx.stroke();
	ctx.restore();
	}

function zeichneAchseHorizontal (ctx,A) {
	var xs = A.x;
	var xe = A.x + A.breite;
	var xf = A.breite/(A.ende-A.start);
	var x0 = xs+Math.abs(A.start)/(Math.abs(A.start)+Math.abs(A.ende))*A.breite;
	var phi = Math.PI/8;
	ctx.beginPath();
	ctx.moveTo(xs, A.y);
	ctx.lineTo(xe, A.y);
	ctx.moveTo(xe, A.y);
	ctx.lineTo(xe - A.hoehe*Math.cos(-phi),A.y - A.hoehe*Math.sin(-phi));
	ctx.moveTo(xe, A.y);
	ctx.lineTo(xe - A.hoehe*Math.cos(phi),A.y - A.hoehe*Math.sin(phi));
	ctx.strokeStyle = A.linienfarbe;
	ctx.lineWidth = A.linienbreite;
	ctx.lineCap = A.linienenden;
	if (A.striche) {
		for (var x = A.strichestart; x <= A.stricheende; x += A.stricheschrittweite) {
			ctx.moveTo(x*xf+x0, A.y-A.hoehe/2);
			ctx.lineTo(x*xf+x0, A.y+A.hoehe/2);
			}
		}
	ctx.font = A.schriftart1;
	ctx.fillStyle = A.schriftfarbe;
	ctx.fillText(A.text,xe + A.textxversatz,A.y + A.textyversatz);
	ctx.font = A.schriftart2;
	if (A.skala) {
		for (var x = A.skalastart; x <= A.skalaende; x += A.skalaschrittweite) {
			if (Math.abs(x) > A.eps) {
				ctx.fillText(String(x.toFixed(A.skalastellen)),x*xf+x0 + A.skalaxversatz,A.y+A.skalayversatz);
				}
			}
		}
	if (A.ursprung) {
		var i = 0.0;
		ctx.fillText(String(i.toFixed(A.skalastellen)),x0 + A.skalaxversatz,A.y + A.skalayversatz);
		}
	ctx.stroke();
	}

function holeAchseHorizontalx (A, x) {
	return x * A.breite / (A.ende - A.start) + A.x + Math.abs(A.start) / (Math.abs(A.start)+Math.abs(A.ende)) * A.breite;
	}
}

<script>
// Automatische Skalierung auf die Fensterbreite (CSS zoom, layouttreu)
function fitSimBreite(){
  var sim = document.querySelector('.LEIFI_animation');
  if(!sim) return;
  var verfuegbar = Math.max(320, document.documentElement.clientWidth - 20);
  var s = Math.min(1, verfuegbar / 903);
  sim.style.zoom = s;
  // Rechtsbuendige Breite im Fluss begrenzen, damit keine Scrollleiste entsteht
  document.body.style.overflowX = 'hidden';
}
window.addEventListener('resize', fitSimBreite);
window.addEventListener('load', fitSimBreite);
fitSimBreite();
</script>
